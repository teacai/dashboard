micronaut:
  application:
    name: wiki
  server:
    port: ${WIKI_PORT:8080}
    # A form can expand every UTF-8 byte to %XX. Includes room for CSRF/password fields.
    max-request-size: ${WIKI_MAX_REQUEST_SIZE:314638336}
    max-request-buffer-size: ${WIKI_MAX_REQUEST_SIZE:314638336}
    netty:
      max-initial-line-length: 16384
      form-max-fields: 8
      form-max-buffered-bytes: ${WIKI_MAX_REQUEST_SIZE:314638336}
  metrics:
    enabled: true
    export:
      jmx:
        enabled: true

# Single-process database; no H2 web console or remote TCP server.
datasources:
  default:
    url: ${WIKI_DB_URL:`jdbc:h2:file:./data/wiki;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=8192`}
    driver-class-name: org.h2.Driver
    username: sa
    password: ${WIKI_DB_PASSWORD:}
    maximum-pool-size: 3
    minimum-idle: 0
    connection-timeout: 10000
    idle-timeout: 60000

flyway:
  datasources:
    default:
      enabled: true

wiki:
  name: ${WIKI_NAME:Wiki}
  max-page-size: ${WIKI_MAX_PAGE_SIZE:104857600}
  master-password: ${WIKI_MASTER_PASSWORD:}
  # Enable when HTTPS terminates at a reverse proxy.
  secure-cookies: ${WIKI_SECURE_COOKIES:false}

logger:
  levels:
    root: INFO
    com.teacai.wiki: INFO
