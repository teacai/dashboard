micronaut:
  application:
    name: wiki
  server:
    port: ${WIKI_PORT:8080}
    # 2 GiB of files + 100 MiB Markdown + 1 MiB multipart metadata/overhead.
    max-request-size: ${WIKI_MAX_REQUEST_SIZE:2253389824}
    # Do not buffer the entire upload in memory. URL-encoded Markdown can expand to %XX.
    max-request-buffer-size: ${WIKI_MAX_BUFFER_SIZE:314638336}
    netty:
      max-initial-line-length: 16384
      form-max-fields: 1024
      form-max-buffered-bytes: ${WIKI_MAX_BUFFER_SIZE:314638336}
    multipart:
      enabled: true
      disk: true
      max-file-size: ${WIKI_MAX_UPLOAD_SIZE:2147483648}
  metrics:
    enabled: true
    export:
      jmx:
        enabled: true

# Single-process database; no H2 web console or remote TCP server.
datasources:
  default:
    url: ${WIKI_DB_URL:`jdbc:h2:file:./data/wiki;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=8192`}
    driver-class-name: org.h2.Driver
    username: sa
    password: ${WIKI_DB_PASSWORD:}
    maximum-pool-size: 3
    # Restore suspends/evicts connections before replacing the database file.
    allow-pool-suspension: true
    minimum-idle: 0
    connection-timeout: 10000
    idle-timeout: 60000

flyway:
  datasources:
    default:
      enabled: true

wiki:
  rate-limit:
    requests-per-minute: ${WIKI_RATE_LIMIT_REQUESTS_PER_MINUTE:60}
    # Enable only behind a trusted proxy that sanitizes forwarding headers.
    trust-forwarded-headers: ${WIKI_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
  name: ${WIKI_NAME:Wiki}
  max-page-size: ${WIKI_MAX_PAGE_SIZE:104857600}
  data-directory: ${WIKI_DATA_DIRECTORY:./data}
  admin-username: ${WIKI_ADMIN_USERNAME:admin}
  admin-password: ${WIKI_ADMIN_PASSWORD:admin112}
  max-restore-size: ${WIKI_MAX_RESTORE_SIZE:21474836480}
  files-directory: ${WIKI_FILES_DIRECTORY:./data/files}
  max-upload-size: ${WIKI_MAX_UPLOAD_SIZE:2147483648}
  master-password: ${WIKI_MASTER_PASSWORD:}
  # Enable when HTTPS terminates at a reverse proxy.
  secure-cookies: ${WIKI_SECURE_COOKIES:false}

logger:
  levels:
    root: INFO
    com.teacai.wiki: INFO
